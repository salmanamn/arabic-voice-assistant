# Volumes on the node's disk. ReadWriteOnce: the writer (a job) and the readers run on the same node. On AKS a
# disk attaches to one node at a time, so the cluster has a single node (D43); Azure Files was not chosen.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  labels: {{- include "voice.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep # `helm uninstall` leaves the downloaded models; delete the PVC by hand
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.models.storage }}
{{- if not (or .Values.ollama.fake .Values.azureOpenAI.enabled) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  labels: {{- include "voice.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.ollama.storage }}
{{- end -}}
