apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-tests
  labels: {{- include "voice.labels" . | nindent 4 }}
data:
  turn_test.py: |
    {{- .Files.Get "files/turn_test.py" | nindent 4 }}
  loadtest.py: |
    {{- .Files.Get "files/loadtest.py" | nindent 4 }}
---
# `helm test voice -n voice --logs`: one spoken turn (M5 Step 5).
apiVersion: v1
kind: Pod
metadata:
  name: voice-test-turn
  labels:
    {{- include "voice.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation # the pod and its log stay until the next test run
spec:
  restartPolicy: Never
  {{- include "voice.podSecurity" . | nindent 2 }}
  containers:
    - name: turn
      image: {{ include "voice.image" (dict "root" . "name" "gateway") }}
      imagePullPolicy: {{ .Values.images.pullPolicy }}
      command: ["python", "/tests/turn_test.py"]
      resources:
        requests: { cpu: 100m, memory: 64Mi }
        limits: { memory: 256Mi }
      {{- include "voice.containerSecurity" . | nindent 6 }}
      volumeMounts:
        - { name: tests, mountPath: /tests, readOnly: true }
        - { name: tmp, mountPath: /tmp }
  volumes:
    - name: tests
      configMap: { name: voice-tests }
    {{- include "voice.tmpVolume" . | nindent 4 }}
{{- if .Values.loadtest.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loadtest
  labels:
    {{- include "voice.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadtest
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {{- include "voice.selector" (dict "root" . "component" "loadtest") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "voice.podSecurity" . | nindent 6 }}
      containers:
        - name: load
          image: {{ include "voice.image" (dict "root" . "name" "gateway") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["python", "/tests/loadtest.py"]
          env:
            - { name: WORKERS, value: {{ .Values.loadtest.workers | quote }} }
            - { name: SECONDS, value: {{ .Values.loadtest.seconds | quote }} }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          {{- include "voice.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tests, mountPath: /tests, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tests
          configMap: { name: voice-tests }
        {{- include "voice.tmpVolume" . | nindent 8 }}
{{- end }}