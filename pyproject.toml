[project]
name = "arabic-voice-assistant"
version = "0.1.0"
description = "Arabic voice assistant: faster-whisper (speech to text), an LLM, Piper (text to speech)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai>=3.51,<4",
    "fastapi>=0.163,<1",
    "uvicorn>=0.54,<1",
    "python-multipart>=0.0.33,<0.1", # file uploads (speech to text, gateway)
]

# One group per future service image (M4): the STT image never installs Piper, the TTS image never installs
# CTranslate2. Locally `uv sync` installs every default group below.
[dependency-groups]
stt = [
    "faster-whisper==1.2.1",
    "av>=18,<19", # faster-whisper 1.2.1 calls av.open(metadata_errors=...), which PyAV 19 removed
]
tts = [
    "piper-tts==1.8.0",
]
models = [
    "huggingface-hub>=1.0,<2",
]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]

[tool.uv]
default-groups = ["stt", "tts", "models", "dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"] # Arabic letters and punctuation are intended, not look-alikes

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]