[project]
name = "arabic-voice-assistant"
version = "0.1.0"
description = "Arabic voice assistant: faster-whisper (speech to text), an LLM, Piper (text to speech)"
requires-python = ">=3.13,<3.14"
dependencies = []

# One group per image (D9, D19): each image installs its own group and nothing else, so speech to text never gets
# Piper (GPL, D3), text to speech never gets CTranslate2, and only the model-fetch job gets the hub client.
# Locally `uv sync` installs every group below.
[dependency-groups]
web = [
    "fastapi>=0.163,<1",
    "uvicorn>=0.54,<1",
]
stt = [
    { include-group = "web" },
    "python-multipart>=0.0.33,<0.1", # the uploaded recording
    "faster-whisper==1.2.1",
    "av>=18,<19", # faster-whisper 1.2.1 calls av.open(metadata_errors=...), which PyAV 19 removed
]
tts = [
    { include-group = "web" },
    "piper-tts==1.8.0",
]
gateway = [
    { include-group = "web" },
    "python-multipart>=0.0.33,<0.1", # the uploaded recording
    "openai>=3.51,<4", # one client for the chat endpoint and both speech services (D10)
    "httpx2>=2.12,<3", # the HTTP client openai uses; the gateway sets its connection limits (D27)
    "azure-identity>=1.27,<2", # Entra ID tokens for Azure OpenAI from the workload identity (D45)
]
models = [
    "huggingface-hub>=1.0,<2",
    "httpx>=0.28,<1", # resumable model downloads (D33); the hub client already depends on it
]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
    "pyyaml>=6,<7", # tests/unit/test_infra_contract.py reads the chart and namespace (the hub client brings it too)
]

[tool.uv]
default-groups = ["stt", "tts", "gateway", "models", "dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"] # Arabic letters and punctuation are intended, not look-alikes

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
