# Local lab for the voice assistant. M1: only the LLM runs in a container; speech runs in the uv environment.
# Do not run together with the ticket-triage lab: both bind 127.0.0.1:11434.
name: voice-lab

services:
  ollama:
    image: ollama/ollama:0.40.15 # same image as ticket-triage-agent (already on disk); CPU only
    container_name: voice-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m # keep the model in memory between turns
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096" # a turn is a short prompt and a short answer
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  ollama: